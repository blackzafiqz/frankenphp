name: Docker

on:
  push:
    tags: ["php*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Image/git tag, e.g. php8.5.12
        required: true
        type: string
      ref:
        description: Git ref to build, e.g. the tag
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract version
        id: version
        run: |
          echo "full=$TAG" >> $GITHUB_OUTPUT
          echo "short=${TAG%.*}" >> $GITHUB_OUTPUT
          echo "php=${TAG#php}" >> $GITHUB_OUTPUT

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: PHP_VERSION=${{ steps.version.outputs.php }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          SHORT=${TAG%.*}

          docker buildx imagetools create \
            -t $REGISTRY/$IMAGE_NAME:$TAG \
            -t $REGISTRY/$IMAGE_NAME:$SHORT \
            $REGISTRY/$IMAGE_NAME:$TAG-amd64 \
            $REGISTRY/$IMAGE_NAME:$TAG-arm64
