name: Build on new dunglas/frankenphp release

on:
    schedule:
        - cron: "*/10 * * * *"
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                branch: ["8.3", "8.4", "8.5"]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.branch }}
                  fetch-depth: 0

            - name: Find latest upstream PHP patch version
              id: upstream
              env:
                  MINOR: ${{ matrix.branch }}
              run: |
                  latest=$(curl -fsS "https://hub.docker.com/v2/repositories/dunglas/frankenphp/tags?name=php${MINOR}.&page_size=100" \
                    | jq -r '.results[].name' \
                    | grep -E "^php${MINOR//./\\.}\.[0-9]+$" \
                    | sed 's/^php//' | sort -V | tail -1)
                  echo "version=$latest" >> "$GITHUB_OUTPUT"
                  if [ -z "$latest" ] || git rev-parse -q --verify "refs/tags/$latest" >/dev/null; then
                    echo "new=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "new=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: docker/setup-buildx-action@v3
              if: steps.upstream.outputs.new == 'true'

            - uses: docker/login-action@v3
              if: steps.upstream.outputs.new == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              if: steps.upstream.outputs.new == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: PHP_VERSION=${{ steps.upstream.outputs.version }}
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
                      ghcr.io/${{ github.repository }}:${{ matrix.branch }}

            - name: Tag repository
              if: steps.upstream.outputs.new == 'true'
              run: |
                  git tag "${{ steps.upstream.outputs.version }}"
                  git push origin "${{ steps.upstream.outputs.version }}"
